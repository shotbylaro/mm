<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linky učení</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap">
<style>
:root {
  /* Tvoje specifikovaná fialová/modrá barva */
  --bg: #4451d4; 
  --panel: #2b3391; 
  --ink: #ffffff;
  --mute: #aab4f0;
  --line: rgba(255,255,255,0.15);
  --halo: #4451d4;
  --red: #ff4a68;
  color-scheme: dark;
  box-sizing: border-box;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Overpass',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 4px;flex-wrap:wrap;z-index:10}
h1{font-size:18px;font-weight:800;margin:0;margin-right:auto; letter-spacing:-0.5px;}
#cnt{font-size:13px;color:var(--mute)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.add{border:0;background:var(--ink);color:var(--bg);border-radius:20px;padding:7px 16px;font-weight:800;font-size:14px}
.sm{border:2px solid var(--line);background:transparent;border-radius:20px;padding:4px 11px;font-size:13px;font-weight:600}
:focus-visible{outline:3px solid #ff4a68;outline-offset:2px}
#tabs{display:flex;gap:6px;padding:6px 16px;overflow-x:auto;z-index:10}
.tab{border:2px solid var(--line);background:transparent;border-radius:18px;padding:5px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bd{background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:1px 6px;margin-left:6px}
#ban{display:none;margin:2px 16px 4px;padding:8px 12px;border-radius:10px;background:var(--panel);border:2px solid var(--red);align-items:center;gap:10px;justify-content:space-between;font-size:14px;z-index:10}
#tip{padding:0 16px 6px;font-size:13px;color:var(--mute);min-height:20px;z-index:10}
main{flex:1;min-height:0;overflow:hidden; position:relative; background:var(--bg); cursor:grab;}
main:active{cursor:grabbing;}
svg{display:block;user-select:none;-webkit-user-select:none; width:100%; height:100%; touch-action:none;}
.st{cursor:pointer}
.lbl{font-size:13px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:6px;pointer-events:none;text-anchor:middle}
.ln{font-size:14px;font-weight:800;cursor:pointer;paint-order:stroke;stroke:var(--halo);stroke-width:5px}
.ring{fill:none;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:p 1.1s ease-in-out infinite alternate}
@keyframes p{from{opacity:.95;transform:scale(1)}to{opacity:.25;transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
#wk{display:none;padding:8px 16px 90px; max-width:560px; margin: 0 auto; height:100%; overflow:auto; position:relative; z-index:15; cursor:auto;}
#wk h3{font-size:15px;margin:16px 0 8px}
.it{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px 8px 24px;margin-bottom:6px;font-weight:600;position:relative}
.it i{position:absolute;left:9px;top:14px;width:8px;height:8px;border-radius:50%}
.it small{color:var(--mute);font-weight:400}
#empty{display:none;max-width:380px;margin:12vh auto 0;padding:0 20px;text-align:center;color:var(--mute);line-height:1.5}
#empty b{color:var(--ink);font-size:20px;display:block;margin-bottom:6px}
.pn{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 24px));background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px;display:none;box-shadow:0 12px 32px rgba(0,0,0,.3);max-height:82vh;overflow:auto;z-index:20}
.pn.on{display:block}
.pn h2{margin:0 0 4px;font-size:20px}
.sub{font-size:13px;color:var(--mute);margin-bottom:12px}
.sg{display:flex;gap:6px;margin-bottom:12px}
.sg button{flex:1;border:2px solid var(--line);background:transparent;border-radius:8px;padding:8px 4px;font-size:14px;font-weight:600; transition:all 0.15s ease}
.sg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--panel)}
.sg .ok{border-color:#1f9d55;color:#1f9d55}.sg .no{border-color:var(--red);color:var(--red)}
textarea,input[type=text],input[type=url]{width:100%;border:2px solid var(--line);border-radius:8px;background:rgba(0,0,0,0.1);padding:10px;font-size:14px;margin-bottom:12px;color:#fff;}
textarea{resize:none;height:80px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px;font-weight:700;}
.go{width:100%;border:0;background:var(--ink);color:var(--bg);border-radius:8px;padding:12px;font-weight:800;font-size:15px;margin-bottom:8px;}
.go-sub{width:100%;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:10px;font-weight:600;margin-bottom:12px;}
.row{display:flex;justify-content:space-between;margin-top:8px}
.row button{border:0;background:none;font-weight:600;font-size:14px;text-decoration:underline;padding:4px}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);background:rgba(0,0,0,0.2); border-radius:14px;padding:3px 8px 3px 12px;font-size:13px;margin:0 6px 6px 0}
.chip button{border:0;background:none;font-size:16px;padding:0 4px}
.msg{font-size:13px;color:var(--mute);margin:-4px 0 12px}
</style>
</head>
<body>

<!-- PŘIHLAŠOVACÍ OBRAZOVKA -->
<div id="login-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
  <h2 style="margin-bottom:12px; font-weight:800; font-size:24px;">Přístup chráněn</h2>
  <input type="password" id="pass-input" placeholder="Zadej heslo" style="width:240px; text-align:center; background:rgba(0,0,0,0.2); border:2px solid rgba(255,255,255,0.2);">
  <button class="add" id="pass-btn" style="padding:10px 24px;">Odemknout</button>
</div>

<script>
  const MOJE_HESLO = "minimetro"; 
  const loginScreen = document.getElementById('login-screen');
  const passBtn = document.getElementById('pass-btn');
  const passInput = document.getElementById('pass-input');

  if (sessionStorage.getItem('unlocked') === 'ano') { loginScreen.style.display = 'none'; }
  passBtn.onclick = () => {
    if (passInput.value === MOJE_HESLO) { loginScreen.style.display = 'none'; sessionStorage.setItem('unlocked', 'ano'); } 
    else { alert('Nesprávné heslo!'); passInput.value = ''; }
  };
  passInput.addEventListener('keypress', e => { if (e.key === 'Enter') passBtn.click(); });
</script>

<!-- HLAVNÍ UI -->
<header>
  <h1>Linky učení</h1>
  <span id="cnt"></span>
  <button class="sm" id="b-export" title="Stáhnout zálohu JSON">Uložit paměť</button>
  <button class="sm" id="b-import" title="Načíst zálohu JSON">Načíst</button>
  <input type="file" id="f-import" accept=".json" style="display:none">
  <button class="sm" id="bd" title="Simulace posunu času o den">+1 den</button>
  <button class="add" id="ba">+ Přidat téma</button>
</header>
<nav id="tabs" role="tablist"></nav>
<div id="ban"><span id="bt"></span><button class="add" id="go">Projet linku</button></div>
<div id="tip"></div>

<main id="mn">
  <div id="empty"><b>Síť metra je prázdná</b>Vygeneruj si témata přes Gemini a vlož je sem.<br><br><button class="add" id="be">Vybudovat novou linku</button></div>
  <svg id="map" role="group" aria-label="Mapa témat"></svg>
  <div id="wk"></div>
</main>

<!-- PANELY -->
<div class="pn" id="p-add" role="dialog" aria-label="Přidat témata">
  <h2 id="at">Nová linka a témata</h2><div class="sub"></div>
  <label for="an">Předmět / Název linky</label>
  <input type="text" id="an" placeholder="např. Fyzika" autocomplete="off">
  <label for="ax">Témata stanic (od Gemini)</label>
  <textarea id="ax" placeholder="# Fyzika:&#10;Téma 1&#10;Téma 2"></textarea>
  <div class="msg">Můžeš vložit i víc linek naráz, stačí zachovat formát # Název:</div>
  <button class="go" id="ago">Položit koleje</button>
  <div class="row"><button id="adel" hidden style="color:var(--red);">Zbourat linku</button><button class="x">Zrušit</button></div>
</div>

<div class="pn" id="p-st" role="dialog" aria-label="Detail tématu">
  <h2 id="sn"></h2><div class="sub" id="ss"></div>
  
  <label>Status stanice</label>
  <div class="sg" id="sg"></div>
  <div id="rv" hidden><div class="sub" id="rvt" style="color:var(--red); font-weight:700;"></div><div class="sg"><button class="ok" id="rok">Pamatuju ✓</button><button class="no" id="rno">Musím zopakovat</button></div></div>
  
  <label for="surl">Materiály (Notion, Docs, Web)</label>
  <div style="display:flex; gap:8px; margin-bottom:12px;">
    <input type="url" id="surl" placeholder="https://..." style="margin-bottom:0; flex:1;">
    <button class="add" id="gourl" style="padding:10px 14px; margin-bottom:0;">Otevřít</button>
  </div>

  <label for="nt">Osobní poznámky</label>
  <textarea id="nt" placeholder="Co si k tomuhle potřebuješ pamatovat..."></textarea>
  
  <label>Přestupy na jiné linky</label>
  <div id="lk" style="margin-bottom:8px;"></div>
  <button class="go-sub" id="lnk">+ Vytvořit nový přestup</button>
  
  <div class="row"><button id="sdel" style="color:var(--red);">Smazat stanici</button><button class="x">Zavřít panel</button></div>
</div>

<div class="pn" id="p-run" role="dialog" aria-label="Jízda opakování">
  <div class="sub" id="rs"></div><h2 id="rn"></h2><div class="sub" id="rnote"></div>
  <div class="sg"><button class="ok" id="yes">Pamatuju ✓</button><button class="no" id="nope">Zapomněl jsem</button></div>
  <div class="row"><button id="skip">Přeskočit na další</button><button class="x">Ukončit jízdu</button></div>
</div>

<script>
const NS='http://www.w3.org/2000/svg', DAY=864e5, INT=[1,3,7,14,30,60], R=12;
// Moderní výrazné Metro barvy
const PAL=['#FFD700','#FF3366','#00E5FF','#00E676','#B388FF','#FF9100','#F50057','#76FF03','#18FFFF','#D500F9'];
const ST=['Nové','Učím se','Umím'];

const $=i=>document.getElementById(i);
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const low=s=>s.trim().toLowerCase();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let D=null;try{D=JSON.parse(localStorage.getItem('metro5')||'null')}catch(e){}
const save=()=>{try{localStorage.setItem('metro5',JSON.stringify(D))}catch(e){}};
const now=()=>Date.now()+((D&&D.off)||0)*DAY;

let tab='',sel=null,pos={},cell={},textDir={},drag=null,linkFrom=null,run=null,hl=null,editLine=null;
let panX=null, panY=null, scale=1, isPanning=false, startPan={x:0,y:0};

const grpOf=l=>(l.g||'Ostatní').split(':')[0];
const groups=()=>[...new Set(D.lines.map(grpOf))];
const lineOf=k=>D.lines.find(l=>l.s.includes(k));
const links=k=>D.links.filter(l=>l.includes(k));
const say=t=>$('tip').textContent=t;
const HINT='Zelená plná = umím. Čárkovaná = učím se. Tažením myši přesouvej mapu.';

if(!D){D={lines:[],st:{},links:[]};}
if(!D.links)D.links=[];

function add(text,defName,g0){
  let cur=defName.trim(),grp=g0||'';
  const lineFor=n=>{let l=D.lines.find(x=>low(x.n)===low(n));
    if(!l){l={id:'l'+Date.now().toString(36)+D.lines.length,n:n.trim(),c:PAL[D.lines.length%PAL.length],s:[]};if(grp)l.g=grp;D.lines.push(l)}return l};
  text.split('\n').forEach(raw=>{
    let t=raw.trim();if(!t)return;
    if(t[0]==='@'){grp=t.slice(1).trim();return}
    const h=t.match(/^#+\s*(.+?):?$/)||t.match(/^(.+):$/);
    if(h){cur=h[1].trim();lineFor(cur);return}
    t=t.replace(/^([-*•]|\d+[.)])\s+/,'');if(!t||!cur)return;
    const l=lineFor(cur);
    let id=Object.keys(D.st).find(k=>low(D.st[k].n)===low(t));
    if(!id){id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);D.st[id]={n:t,s:0}}
    if(!l.s.includes(id))l.s.push(id);
  });
  save();
}

const pass=k=>{const s=D.st[k];return s.s===2&&s.due<=now()?Math.min(6,1+Math.floor((now()-s.due)/DAY)):0};
const dueList=()=>Object.keys(D.st).filter(k=>pass(k)>0);
const isActive = k => D.st[k].s > 0 || D.picks.includes(k) || pass(k) > 0;

function setS(k,i){const s=D.st[k];s.s=i;s.t=now();if(i===2){if(!s.due){s.lv=0;s.due=now()+DAY}}else{delete s.due;delete s.lv}save()}
function review(k,ok){const s=D.st[k];s.lv=ok?Math.min((s.lv||0)+1,5):0; s.due=now()+Math.max(.5,INT[s.lv]/(1+.25*Math.min(4,links(k).length)))*DAY;save()}
function route(){
  const due=dueList().sort((a,b)=>D.st[a].due-D.st[b].due),set=new Set(due),seen=new Set(),r=[];
  const adj=k=>links(k).map(l=>l[0]===k?l[1]:l[0]);
  due.forEach(s=>{if(seen.has(s))return;const q=[s];seen.add(s); while(q.length){const c=q.shift();r.push(c);adj(c).forEach(n=>{if(set.has(n)&&!seen.has(n)){seen.add(n);q.push(n)}})}});
  return r;
}
function nextFor(g,n,ex){
  const out=[];
  D.lines.filter(l=>grpOf(l)===g).forEach(l=>{if(out.length>=n)return; const k=l.s.find(x=>D.st[x].s===0&&!ex.includes(x)&&!out.includes(x));if(k)out.push(k)});
  return out;
}
function tickWeek(){
  const w=Math.floor((now()/DAY+3)/7);
  if(D.wk!==w||!D.picks){D.wk=w;D.picks=groups().flatMap(g=>nextFor(g,2,[]));save()}
}

function wrap(n){
  const o=[''];n.split(' ').forEach(x=>{const c=o[o.length-1];if(c&&(c+' '+x).length>15)o.push(x);else o[o.length-1]=(c+' '+x).trim()});
  if(o.length>2){o.length=2;o[1]=o[1].slice(0,13)+'…'}return o;
}

// Zaručený Metro Router - Dělá pouze 0°, 45° a 90° čáry!
function metroSeg(a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const adx = Math.abs(dx), ady = Math.abs(dy);
  if (adx < 1 || ady < 1 || Math.abs(adx - ady) < 1) return `M${a[0]},${a[1]} L${b[0]},${b[1]}`; // Rovně nebo přesně 45°
  
  // Zatáčka ve stylu Mini Metro (rovně, pak 45° k cíli)
  const dMin = Math.min(adx, ady);
  const p2x = b[0] - Math.sign(dx) * dMin;
  const p2y = b[1] - Math.sign(dy) * dMin;
  return `M${a[0]},${a[1]} L${p2x},${p2y} L${b[0]},${b[1]}`;
}

function layout(){
  pos={}; cell={}; textDir={};
  const isCelá = tab === 'Celá síť';
  const visLines = D.lines.filter(l => l.s.length > 0);
  const cx = 0, cy = 0; 

  visLines.forEach((l, i) => {
    // 8 základních os = striktní rozestupy (0, 45, 90...)
    let baseAngle = (i % 8) * (Math.PI / 4);
    if (i >= 8) baseAngle += Math.PI / 8; // Posun pro další linky

    let r = 80; 
    const visNodes = l.s.filter(k => isCelá || isActive(k));

    visNodes.forEach((k, j) => {
      // MEGA rozestup, ať se texty v životě nepotkají
      r += 240 + (j%2===0 ? 40 : 0); 
      
      // Mírný rozptyl úhlu, aby to nevypadalo jako dokonalá hvězdička
      let angleOffset = (j % 2 === 1) ? 0.12 : -0.12;
      let currentAngle = baseAngle + angleOffset;

      const x = cx + Math.cos(currentAngle) * r;
      const y = cy + Math.sin(currentAngle) * r;
      pos[k] = [x, y];

      // Text striktně střídá nad / pod
      textDir[k] = (j % 2 === 0) ? 1 : -1; 
    });

    if(visNodes.length > 0) { cell[l.id] = [cx + Math.cos(baseAngle)*120, cy + Math.sin(baseAngle)*120]; } 
    else { cell[l.id] = [cx, cy]; }
  });
  return visLines;
}

function render(){
  tickWeek();
  if(panX === null) { panX = window.innerWidth / 2; panY = window.innerHeight / 2; }
  
  const tabs=['Aktuální mapa', 'Celá síť', 'List úkolů'];
  if(!tab||!tabs.includes(tab))tab='Aktuální mapa';
  const due=dueList();
  const open=D.picks.filter(k=>D.st[k]&&D.st[k].s===0).length;
  
  $('tabs').innerHTML='';
  tabs.forEach(t=>{
    const b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');b.setAttribute('aria-selected',t===tab);
    b.textContent=t;
    const n = t==='List úkolů' ? due.length+open : (t==='Aktuální mapa' ? due.length : 0);
    if(n){const s=document.createElement('span');s.className='bd';s.textContent=n;b.appendChild(s)}
    b.onclick=()=>{tab=t;render()};$('tabs').appendChild(b);
  });

  const mp=Math.max(0,...dueList().map(pass));
  $('ban').style.display=due.length?'flex':'none';
  $('bt').textContent=(mp>=5?'Kritický stav! ':'')+due.length+' témat k procvičení';
  const ks=Object.keys(D.st),n2=ks.filter(k=>D.st[k].s===2).length;
  $('cnt').textContent=ks.length?n2+'/'+ks.length+' umím':'';
  if(!linkFrom&&!$('tip').textContent)say(HINT);
  
  const has=ks.length>0;$('empty').style.display=has?'none':'block';
  const svg=$('map');
  
  if(tab==='List úkolů'){svg.style.display='none';$('wk').style.display=has?'block':'none';if(has)$('wk').innerHTML=wkHtml();return}
  $('wk').style.display='none';svg.style.display='block';svg.innerHTML='';
  
  const visLines = layout();
  const vp = el('g', {id:'vp', transform:`translate(${panX},${panY}) scale(${scale})`}, svg);

  // VYKRESLENÍ LINEK
  visLines.forEach(l=>{
    const visNodes = l.s.filter(k => pos[k]);
    if (!visNodes.length) return;
    
    const t=el('text',{x:cell[l.id][0],y:cell[l.id][1],class:'ln',fill:l.c,tabindex:0,role:'button', 'text-anchor':'middle'},vp);
    t.textContent=l.n;t.onclick=()=>openAdd(l);
    
    for(let i=1;i<visNodes.length;i++) {
        const a = visNodes[i-1], b = visNodes[i];
        const statA = D.st[a].s, statB = D.st[b].s;

        // Nemám = není spojené v "Aktuální mapa"
        if (tab === 'Aktuální mapa' && (statA === 0 || statB === 0)) continue;

        let strokeW = 4;
        let strokeC = l.c;
        let dash = 'none';
        let opac = 1;

        if (statA === 2 && statB === 2) {
            // Umím oboje -> Zářivá plná čára
            strokeW = 8;
        } else if (statA > 0 && statB > 0) {
            // Učím se -> Přerušovaná čára
            strokeW = 6;
            dash = '12 12';
            opac = 0.8;
        } else if (tab === 'Celá síť') {
            // Jen náhled do budoucna (cokoliv s Nové)
            strokeC = 'var(--line)';
            strokeW = 4;
            dash = '4 8';
        }
        
        el('path',{d:metroSeg(pos[a],pos[b]),fill:'none',stroke:strokeC,'stroke-width':strokeW,'stroke-linejoin':'round','stroke-linecap':'round','stroke-dasharray':dash, opacity:opac},vp);
    }
  });

  // UŽIVATELSKÉ PŘESTUPY
  D.links.forEach(([a,b])=>{if(!pos[a]||!pos[b])return;
    const x=grpOf(lineOf(a))!==grpOf(lineOf(b));
    el('path',{d:metroSeg(pos[a],pos[b]),fill:'none',stroke:x?'var(--ink)':lineOf(a).c,'stroke-width':8,'stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':x?'12 10':'none', opacity:0.6},vp);
  });

  // VYKRESLENÍ STANIC
  for(const k in pos){
    const s=D.st[k];
    const n=pass(k);
    const lineCol = lineOf(k).c;
    const g=el('g',{class:'st',tabindex:0,role:'button','aria-label':s.n,transform:`translate(${pos[k]})`},vp);
    
    if(n)el('circle',{class:'ring',r:R+8,stroke:'var(--red)'},g);
    if(hl===k)el('circle',{class:'ring',r:R+12,stroke:'#00E5FF'},g);
    
    if (s.s === 2) {
      // Umím - Vyplněná Metro stanice s bílým středem
      el('circle',{r:R+2, fill:lineCol}, g);
      el('circle',{r:R-4, fill:'var(--ink)'}, g);
    } else if (s.s === 1) {
      // Učím se - Prázdný barevný kroužek
      el('circle',{r:R+1, stroke:lineCol, 'stroke-width':5, fill:'var(--bg)'}, g);
    } else {
      // Nové - jen nenápadná tečka
      el('circle',{r:7, fill:'var(--mute)'}, g);
      if(D.picks.includes(k)) el('circle',{r:R+4,fill:'none',stroke:'var(--mute)','stroke-width':2,'stroke-dasharray':'2 4'},g);
    }

    // Text label
    const lines = wrap(s.n);
    const isAbove = textDir[k] < 0;
    
    lines.forEach((tx,j)=>{
      const yOff = isAbove ? (-R - 12 - (lines.length - 1 - j)*16) : (R + 22 + j*16);
      const textNode = el('text',{class:'lbl',y:yOff},g);
      textNode.textContent = tx;
      if(s.s === 0) { 
        textNode.style.fill = 'var(--mute)'; 
      }
    });

    g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tapSt(k)}};
  }
}

function wkHtml(){
  const H=k=>`<button class="it" data-k="${k}"><i style="background:${lineOf(k).c}"></i>${esc(D.st[k].n)}<small>${ST[D.st[k].s]}</small></button>`;
  const due=dueList();
  const picks1 = D.picks || [];
  const picks2 = groups().flatMap(g=>nextFor(g, 2, picks1));
  const picks3 = groups().flatMap(g=>nextFor(g, 2, [...picks1, ...picks2]));
  
  return '<h3>Stanice na tento týden</h3>'+(picks1.length?picks1.map(H).join(''):'<div class="sub">Vše načato. Mapa se zvětšuje!</div>')
   +'<h3>Opakovací jízda (Kritické stanice)</h3>'+(due.length?due.map(H).join('')+'<button class="go" id="go2" style="margin-top:10px">Projet kritické linky</button>':'<div class="sub">Všechno umíš. Stanice odbaveny.</div>')
   +'<h3>Náhled: Příští týden</h3>'+(picks2.length?picks2.map(H).join(''):'<div class="sub">Konec sítě.</div>')
   +'<h3>Náhled: Za 14 dní</h3>'+(picks3.length?picks3.map(H).join(''):'<div class="sub">Konec sítě.</div>');
}

/* --- PAN/ZOOM A INTERAKCE --- */
const svg=$('map');
const pt=e=>{const r=svg.getBoundingClientRect(); return [(e.clientX - r.left - panX) / scale, (e.clientY - r.top - panY) / scale];};
const hit=(p,r)=>Object.keys(pos).filter(k=>Math.hypot(pos[k][0]-p[0],pos[k][1]-p[1])<r).sort((a,b)=>Math.hypot(pos[a][0]-p[0],pos[a][1]-p[1])-Math.hypot(pos[b][0]-p[0],pos[b][1]-p[1]))[0];

svg.onpointerdown=e=>{
  if(tab==='List úkolů') return;
  const p=pt(e);
  const k=hit(p, 25 / scale);
  if (k) { drag={k,p,moved:false}; } 
  else { isPanning = true; startPan = {x: e.clientX - panX, y: e.clientY - panY}; }
  try{svg.setPointerCapture(e.pointerId)}catch(x){}
};
svg.onpointermove=e=>{
  if(isPanning) { panX = e.clientX - startPan.x; panY = e.clientY - startPan.y; const vp = $('vp'); if(vp) vp.setAttribute('transform', `translate(${panX},${panY}) scale(${scale})`); return; }
  if(!drag)return;const p=pt(e);
  if(Math.hypot(p[0]-drag.p[0],p[1]-drag.p[1])>10 / scale)drag.moved=true;
  if(drag.moved&&drag.k){
    let t=$('tmp');if(!t)t=el('path',{id:'tmp',fill:'none','stroke-width':8,'stroke-linecap':'round',opacity:.55,'pointer-events':'none'},$('vp'));
    t.setAttribute('stroke',lineOf(drag.k).c);t.setAttribute('d',metroSeg(pos[drag.k],p));
  }
};
svg.onpointerup=e=>{
  if(isPanning) { isPanning = false; return; }
  if(!drag)return;const d=drag;drag=null;const t=$('tmp');if(t)t.remove();const p=pt(e);
  if(!d.moved){if(d.k)tapSt(d.k);else{const l=D.lines.find(l=>cell[l.id]&&Math.hypot(p[0]-cell[l.id][0], p[1]-cell[l.id][1])<40 / scale);if(l)openAdd(l)}return}
  if(d.k){const k=hit(p,30 / scale);if(k&&k!==d.k)connect(d.k,k)}
};
svg.onwheel = e => {
  e.preventDefault();
  const xs = (e.clientX - panX) / scale, ys = (e.clientY - panY) / scale;
  scale *= e.deltaY > 0 ? 0.88 : 1.12; 
  scale = Math.max(0.05, Math.min(scale, 4)); 
  panX = e.clientX - xs * scale; panY = e.clientY - ys * scale;
  const vp = $('vp'); if(vp) vp.setAttribute('transform', `translate(${panX},${panY}) scale(${scale})`);
};

function connect(a,b){
  if(D.st[a].s<1||D.st[b].s<1){say('Spojit jdou jen probíhající a hotové stanice (Učím se / Umím).');return}
  if(D.links.some(l=>l.includes(a)&&l.includes(b))){say('Tento přestup už existuje.');return}
  D.links.push([a,b]);save();say('Vytvořen přestup: '+D.st[a].n+' ↔ '+D.st[b].n);render();
}
function tapSt(k){
  if(linkFrom){const a=linkFrom;linkFrom=null;if(a!==k)connect(a,k);else{say(HINT)}return}
  openSt(k);
}
function closeAll(){document.querySelectorAll('.pn').forEach(p=>p.classList.remove('on'))}
function show(id,f){closeAll();$(id).classList.add('on');if(f)f.focus()}
document.querySelectorAll('.x').forEach(b=>b.onclick=()=>{closeAll();if(run){run=null;hl=null;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
window.onresize=()=>{ panX = window.innerWidth/2; panY = window.innerHeight/2; render(); };

function openSt(k){
  sel=k;const s=D.st[k];
  $('sn').textContent=s.n;$('ss').textContent=lineOf(k).n;
  [...$('sg').children].forEach((b,i)=>b.setAttribute('aria-pressed',s.s===i));
  const n=pass(k);$('rv').hidden=!n;
  if(n)$('rvt').textContent='Pozor: Potřebuje procvičit '+(n>1?'(už '+n+' dny)':'');
  $('lk').innerHTML=links(k).map(l=>{const o=l[0]===k?l[1]:l[0];return'<span class="chip">'+esc(D.st[o].n)+'<button data-u="'+o+'" aria-label="Odpojit">×</button></span>'}).join('');
  
  $('nt').value=s.note||'';
  $('surl').value=s.url||'';
  show('p-st');
}
ST.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{setS(sel,i);render();openSt(sel)};$('sg').appendChild(b)});
$('lk').onclick=e=>{const u=e.target.dataset.u;if(u){D.links=D.links.filter(l=>!(l.includes(sel)&&l.includes(u)));save();render();openSt(sel)}};
$('rok').onclick=()=>{review(sel,true);render();closeAll();say('Skvěle, stanice uložena do paměti.')};
$('rno').onclick=()=>{review(sel,false);render();closeAll();say('Nevadí, projedeme to znovu brzy.')};
$('lnk').onclick=()=>{if(D.st[sel].s<1){say('Založ stanici (Učím se), než uděláš přestup.');closeAll();return}linkFrom=sel;closeAll();say('Tažením nebo klepnutím vyber druhou stanici pro přestup.')};
$('nt').oninput=e=>{D.st[sel].note=e.target.value;save()};
$('surl').oninput=e=>{D.st[sel].url=e.target.value;save()};
$('gourl').onclick=()=>{if(D.st[sel].url) window.open(D.st[sel].url, '_blank'); else alert("Nejprve vlož odkaz (např. na Notion nebo Docs).");};
$('sdel').onclick=()=>{D.lines.forEach(l=>l.s=l.s.filter(k=>k!==sel));D.links=D.links.filter(l=>!l.includes(sel));delete D.st[sel];save();closeAll();render()};

function startRun(){const r=route();if(!r.length)return;run={r,i:0};showRun()}
function showRun(){
  if(run.i>=run.r.length){run=null;hl=null;closeAll();say('Síť vyčištěna.');render();return}
  const k=run.r[run.i];hl=k;
  $('rs').textContent='Zastávka '+(run.i+1)+' z '+run.r.length+' · '+lineOf(k).n;
  $('rn').textContent=D.st[k].n;$('rnote').textContent=D.st[k].note||'';
  show('p-run');
  if(tab==='List úkolů'||!pos[k])tab='Aktuální mapa';
  render();
}
$('go').onclick=startRun;
$('wk').onclick=e=>{if(e.target.id==='go2')return startRun();const b=e.target.closest('[data-k]');if(b)openSt(b.dataset.k)};
$('yes').onclick=()=>{review(run.r[run.i],true);run.i++;showRun()};
$('nope').onclick=()=>{review(run.r[run.i],false);run.i++;showRun()};
$('skip').onclick=()=>{run.i++;showRun()};
$('bd').onclick=()=>{D.off=(D.off||0)+1;save();say('Čas se posunul o 1 den.');render()};

function openAdd(l){
  editLine=l||null;$('an').value=l?l.n:'';$('ax').value='';
  $('at').textContent=l?'Položit novou trať: '+l.n:'Nová linka a témata';$('adel').hidden=!l;
  show('p-add',l?$('ax'):$('an'));
}
$('ba').onclick=()=>openAdd(null);$('be').onclick=()=>openAdd(null);
$('ago').onclick=()=>{
  const name=$('an').value.trim(),text=$('ax').value;
  if(!name&&!/^\s*(#.+|.+:)\s*$/m.test(text)){$('an').focus();return}
  add(text,name,'');closeAll();render();
};
$('adel').onclick=()=>{
  const l=editLine;if(!l)return;D.lines=D.lines.filter(x=>x!==l);
  const used=new Set();D.lines.forEach(x=>x.s.forEach(k=>used.add(k)));
  for(const k in D.st)if(!used.has(k)){delete D.st[k];D.links=D.links.filter(z=>!z.includes(k))}
  save();closeAll();render();
};

$('b-export').onclick = () => {
  const dl = document.createElement('a');
  dl.setAttribute("href", "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(D)));
  dl.setAttribute("download", "linky_uceni_pamet.json");
  dl.click(); say('Záloha sítě stažena.');
};
$('b-import').onclick = () => $('f-import').click();
$('f-import').onchange = (e) => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = (event) => { try { D = JSON.parse(event.target.result); save(); render(); say('Síť načtena!'); } catch(err) {} };
  r.readAsText(f); e.target.value=''; 
};

render();
</script>
