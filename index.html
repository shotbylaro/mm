<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linky učení</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap">
<style>
:root{--bg:#f1f3f5;--ink:#1b2430;--mute:#6b7886;--panel:#fff;--line:#d5dbe1;--halo:#f1f3f5;--red:#e5484d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b23;--ink:#e8edf2;--mute:#93a1b0;--panel:#1d2631;--line:#2d3947;--halo:#141b23;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Overpass',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 4px;flex-wrap:wrap;z-index:10}
h1{font-size:18px;font-weight:800;margin:0;margin-right:auto}
#cnt{font-size:13px;color:var(--mute)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.add{border:0;background:var(--ink);color:var(--bg);border-radius:20px;padding:7px 16px;font-weight:600;font-size:14px}
.sm{border:2px solid var(--line);background:transparent;border-radius:20px;padding:4px 11px;font-size:13px;font-weight:600}
:focus-visible{outline:3px solid #2f7de1;outline-offset:2px}
#tabs{display:flex;gap:6px;padding:6px 16px;overflow-x:auto;z-index:10}
.tab{border:2px solid var(--line);background:transparent;border-radius:18px;padding:5px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bd{background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:1px 6px;margin-left:6px}
#ban{display:none;margin:2px 16px 4px;padding:8px 12px;border-radius:10px;background:var(--panel);border:2px solid var(--red);align-items:center;gap:10px;justify-content:space-between;font-size:14px;z-index:10}
#tip{padding:0 16px 6px;font-size:13px;color:var(--mute);min-height:20px;z-index:10}
main{flex:1;min-height:0;overflow:hidden; position:relative; background:var(--bg); cursor:grab;}
main:active{cursor:grabbing;}
svg{display:block;user-select:none;-webkit-user-select:none; width:100%; height:100%; touch-action:none;}
.st{cursor:pointer}
.lbl{font-size:11.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;pointer-events:none;text-anchor:middle}
.ln{font-size:14px;font-weight:800;cursor:pointer;paint-order:stroke;stroke:var(--halo);stroke-width:4px}
.ring{fill:none;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:p 1.1s ease-in-out infinite alternate}
@keyframes p{from{opacity:.95;transform:scale(1)}to{opacity:.25;transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
#wk{display:none;padding:8px 16px 90px; max-width:560px; margin: 0 auto; height:100%; overflow:auto; position:relative; z-index:15; cursor:auto;}
#wk h3{font-size:15px;margin:16px 0 8px}
.it{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px 8px 24px;margin-bottom:6px;font-weight:600;position:relative}
.it i{position:absolute;left:9px;top:14px;width:8px;height:8px;border-radius:50%}
.it small{color:var(--mute);font-weight:400}
#empty{display:none;max-width:380px;margin:12vh auto 0;padding:0 20px;text-align:center;color:var(--mute);line-height:1.5}
#empty b{color:var(--ink);font-size:20px;display:block;margin-bottom:6px}
.pn{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 24px));background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.14);max-height:82vh;overflow:auto;z-index:20}
.pn.on{display:block}
.pn h2{margin:0 0 4px;font-size:18px}
.sub{font-size:13px;color:var(--mute);margin-bottom:10px}
.sg{display:flex;gap:6px;margin-bottom:10px}
.sg button{flex:1;border:2px solid var(--line);background:transparent;border-radius:8px;padding:8px 4px;font-size:14px;font-weight:600}
.sg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--panel)}
.sg .ok{border-color:#1f9d55;color:#1f9d55}.sg .no{border-color:var(--red);color:var(--red)}
textarea,input[type=text]{width:100%;border:2px solid var(--line);border-radius:8px;background:transparent;padding:8px;font-size:14px;margin-bottom:8px}
textarea{resize:none;height:100px}#nt{height:60px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:2px}
.go{width:100%;border:0;background:var(--ink);color:var(--panel);border-radius:8px;padding:10px;font-weight:600;margin-bottom:8px}
.row{display:flex;justify-content:space-between;margin-top:4px}
.row button{border:0;background:none;font-weight:600;font-size:14px;text-decoration:underline;padding:4px}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:14px;padding:1px 4px 1px 10px;font-size:13px;margin:0 6px 6px 0}
.chip button{border:0;background:none;font-size:16px;padding:0 4px}
.msg{font-size:13px;color:var(--mute);margin:-2px 0 8px}
</style>
</head>
<body>

<div id="login-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
  <h2 style="margin-bottom:12px;">Přístup chráněn</h2>
  <input type="password" id="pass-input" placeholder="Zadej heslo" style="width:200px; text-align:center; padding:8px; border:2px solid var(--line); border-radius:8px; background:var(--panel); margin-bottom:12px;">
  <button class="add" id="pass-btn">Odemknout</button>
</div>

<script>
  const MOJE_HESLO = "minimetro"; 
  const loginScreen = document.getElementById('login-screen');
  const passBtn = document.getElementById('pass-btn');
  const passInput = document.getElementById('pass-input');

  if (sessionStorage.getItem('unlocked') === 'ano') {
    loginScreen.style.display = 'none';
  }

  passBtn.onclick = () => {
    if (passInput.value === MOJE_HESLO) {
      loginScreen.style.display = 'none';
      sessionStorage.setItem('unlocked', 'ano');
    } else {
      alert('Nesprávné heslo!');
      passInput.value = '';
    }
  };
  passInput.addEventListener('keypress', function (e) {
    if (e.key === 'Enter') passBtn.click();
  });
</script>

<header>
  <h1>Linky učení</h1>
  <span id="cnt"></span>
  <button class="sm" id="b-export" title="Stáhnout zálohu JSON">Uložit</button>
  <button class="sm" id="b-import" title="Načíst zálohu JSON">Načíst</button>
  <input type="file" id="f-import" accept=".json" style="display:none">
  <button class="sm" id="bd" title="Simulace posunu času o den">+1 den</button>
  <button class="add" id="ba">+ Přidat</button>
</header>
<nav id="tabs" role="tablist"></nav>
<div id="ban"><span id="bt"></span><button class="add" id="go">Jet vlakem</button></div>
<div id="tip"></div>
<main id="mn">
  <div id="empty"><b>Síť je prázdná</b>Zkus přes tlačítko přidat nová témata.<br><br><button class="add" id="be">Vložit témata</button></div>
  <svg id="map" role="group" aria-label="Mapa témat"></svg>
  <div id="wk"></div>
</main>

<div class="pn" id="p-add" role="dialog" aria-label="Přidat témata">
  <h2 id="at">Přidat témata</h2><div class="sub"></div>
  <label for="an">Předmět / Linka</label><input type="text" id="an" placeholder="např. Fyzika" autocomplete="off">
  <label for="ax">Témata (vlož vygenerovaný list z Gemini)</label>
  <textarea id="ax" placeholder="# Předmět:&#10;Téma 1&#10;Téma 2"></textarea>
  <div class="msg">Můžeš rovnou vložit celý seznam od AI, jen zachovej hashtag a dvojtečku pro názvy linek.</div>
  <button class="go" id="ago">Přidat na mapu</button>
  <div class="row"><button id="adel" hidden>Smazat linku</button><button class="x">Zavřít</button></div>
</div>

<div class="pn" id="p-st" role="dialog" aria-label="Detail tématu">
  <h2 id="sn"></h2><div class="sub" id="ss"></div>
  <div class="sg" id="sg"></div>
  <div id="rv" hidden><div class="sub" id="rvt"></div><div class="sg"><button class="ok" id="rok">Pamatuju ✓</button><button class="no" id="rno">Zapomněl jsem</button></div></div>
  <div id="lk"></div>
  <button class="go" id="lnk">Spojit s dalším tématem</button>
  <textarea id="nt" placeholder="Tvé poznámky…" aria-label="Poznámky"></textarea>
  <div class="row"><button id="sdel">Smazat téma</button><button class="x">Zavřít</button></div>
</div>

<div class="pn" id="p-run" role="dialog" aria-label="Jízda opakování">
  <div class="sub" id="rs"></div><h2 id="rn"></h2><div class="sub" id="rnote"></div>
  <div class="sg"><button class="ok" id="yes">Pamatuju ✓</button><button class="no" id="nope">Zapomněl jsem</button></div>
  <div class="row"><button id="skip">Přeskočit</button><button class="x">Ukončit jízdu</button></div>
</div>

<script>
const NS='http://www.w3.org/2000/svg',DAY=864e5,INT=[1,3,7,14,30,60],R=11;
const PAL=['#2f6fd6','#d9342b','#1f9d55','#e08a00','#8b45c9','#0aa2b8','#d6428c','#6b7280','#7a9a01','#b5651d'];
const ST=['Nové','Učím se','Umím'];

const $=i=>document.getElementById(i);
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const low=s=>s.trim().toLowerCase();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null;try{D=JSON.parse(localStorage.getItem('metro5')||'null')}catch(e){}
const save=()=>{try{localStorage.setItem('metro5',JSON.stringify(D))}catch(e){}};
const now=()=>Date.now()+((D&&D.off)||0)*DAY;

let tab='',sel=null,pos={},cell={},drag=null,linkFrom=null,run=null,hl=null,editLine=null;
let panX=null, panY=null, scale=1, isPanning=false, startPan={x:0,y:0};

const grpOf=l=>(l.g||'Ostatní').split(':')[0];
const groups=()=>[...new Set(D.lines.map(grpOf))];
const lineOf=k=>D.lines.find(l=>l.s.includes(k));
const links=k=>D.links.filter(l=>l.includes(k));
const say=t=>$('tip').textContent=t;
const HINT='Mini Metro styl: Pohybuj se tažením, přibližuj kolečkem. Spoj témata tažením čáry.';

function add(text,defName,g0){
  let cur=defName.trim(),grp=g0||'';
  const lineFor=n=>{let l=D.lines.find(x=>low(x.n)===low(n));
    if(!l){l={id:'l'+Date.now().toString(36)+D.lines.length,n:n.trim(),c:PAL[D.lines.length%PAL.length],s:[]};if(grp)l.g=grp;D.lines.push(l)}return l};
  text.split('\n').forEach(raw=>{
    let t=raw.trim();if(!t)return;
    if(t[0]==='@'){grp=t.slice(1).trim();return}
    const h=t.match(/^#+\s*(.+?):?$/)||t.match(/^(.+):$/);
    if(h){cur=h[1].trim();lineFor(cur);return}
    t=t.replace(/^([-*•]|\d+[.)])\s+/,'');if(!t||!cur)return;
    const l=lineFor(cur);
    let id=Object.keys(D.st).find(k=>low(D.st[k].n)===low(t));
    if(!id){id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);D.st[id]={n:t,s:0}}
    if(!l.s.includes(id))l.s.push(id);
  });
  save();
}
if(!D){D={lines:[],st:{},links:[]};}
if(!D.links)D.links=[];

/* --- učení a opakování --- */
const pass=k=>{const s=D.st[k];return s.s===2&&s.due<=now()?Math.min(6,1+Math.floor((now()-s.due)/DAY)):0};
const dueList=()=>Object.keys(D.st).filter(k=>pass(k)>0);
const isActive = k => D.st[k].s > 0 || D.picks.includes(k);

function setS(k,i){const s=D.st[k];s.s=i;s.t=now();if(i===2){if(!s.due){s.lv=0;s.due=now()+DAY}}else{delete s.due;delete s.lv}save()}
function review(k,ok){const s=D.st[k];s.lv=ok?Math.min((s.lv||0)+1,5):0;
  s.due=now()+Math.max(.5,INT[s.lv]/(1+.25*Math.min(4,links(k).length)))*DAY;save()}
function route(){
  const due=dueList().sort((a,b)=>D.st[a].due-D.st[b].due),set=new Set(due),seen=new Set(),r=[];
  const adj=k=>links(k).map(l=>l[0]===k?l[1]:l[0]);
  due.forEach(s=>{if(seen.has(s))return;const q=[s];seen.add(s);
    while(q.length){const c=q.shift();r.push(c);adj(c).forEach(n=>{if(set.has(n)&&!seen.has(n)){seen.add(n);q.push(n)}})}});
  return r;
}
function nextFor(g,n,ex){
  const out=[];
  D.lines.filter(l=>grpOf(l)===g).forEach(l=>{if(out.length>=n)return;
    const k=l.s.find(x=>D.st[x].s===0&&!ex.includes(x)&&!out.includes(x));if(k)out.push(k)});
  return out;
}
function tickWeek(){
  const w=Math.floor((now()/DAY+3)/7);
  if(D.wk!==w||!D.picks){D.wk=w;D.picks=groups().flatMap(g=>nextFor(g,2,[]));save()}
}

/* --- Vykreslování Mini Metro --- */
function wrap(n){
  const o=[''];n.split(' ').forEach(x=>{const c=o[o.length-1];if(c&&(c+' '+x).length>13)o.push(x);else o[o.length-1]=(c+' '+x).trim()});
  if(o.length>2){o.length=2;o[1]=o[1].slice(0,11)+'…'}return o;
}
function layout(){
  pos={}; cell={};
  const isCelá = tab === 'Celá síť';
  const visLines = D.lines.filter(l => l.s.length > 0);
  const cx = 0, cy = 0; // Střed mapy (0,0)

  const angleStep = (Math.PI * 2) / Math.max(1, visLines.length);

  visLines.forEach((l, i) => {
    const baseAngle = i * angleStep;
    let r = 0;
    let lastPos = [cx, cy];
    
    const visNodes = l.s.filter(k => isCelá || isActive(k));

    visNodes.forEach((k, j) => {
      const wave = (j % 2 === 0 ? 1 : -1) * 0.18; 
      const angle = baseAngle + wave;
      r += 100; // Konstantní rozestup mezi stanicemi
      
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      pos[k] = [x, y];
      lastPos = [x, y];
    });

    if(visNodes.length > 0) {
      cell[l.id] = [lastPos[0] + Math.cos(baseAngle)*60, lastPos[1] + Math.sin(baseAngle)*60];
    } else {
      cell[l.id] = [cx + Math.cos(baseAngle)*60, cy + Math.sin(baseAngle)*60];
    }
  });
  return visLines;
}
function seg(a,b){
  const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.abs(dy);
  if(!dy||Math.abs(dx)<d)return`M${a} L${b}`;
  const s=Math.sign(dx);return`M${a} L${b[0]-s*d},${a[1]} L${b}`;
}

function render(){
  tickWeek();
  if(panX === null) { panX = window.innerWidth / 2; panY = window.innerHeight / 2; }
  
  const tabs=['Aktuální mapa', 'Celá síť', 'List úkolů'];
  if(!tab||!tabs.includes(tab))tab='Aktuální mapa';
  const due=dueList(),dg={};due.forEach(k=>{const g=grpOf(lineOf(k));dg[g]=(dg[g]||0)+1});
  const open=D.picks.filter(k=>D.st[k]&&D.st[k].s===0).length;
  
  $('tabs').innerHTML='';
  tabs.forEach(t=>{
    const b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');b.setAttribute('aria-selected',t===tab);
    b.textContent=t;
    const n = t==='List úkolů' ? due.length+open : (t==='Aktuální mapa' ? due.length : 0);
    if(n){const s=document.createElement('span');s.className='bd';s.textContent=n;b.appendChild(s)}
    b.onclick=()=>{tab=t;render()};$('tabs').appendChild(b);
  });

  const mp=Math.max(0,...dueList().map(pass));
  $('ban').style.display=due.length?'flex':'none';
  $('bt').textContent=(mp>=5?'Kritický stav linky! ':'')+due.length+' témat k procvičení';
  const ks=Object.keys(D.st),n2=ks.filter(k=>D.st[k].s===2).length;
  $('cnt').textContent=ks.length?n2+'/'+ks.length+' umím':'';
  document.title=(due.length?'('+due.length+') ':'')+'Linky učení';
  if(!linkFrom&&!$('tip').textContent)say(HINT);
  
  const has=ks.length>0;$('empty').style.display=has?'none':'block';
  const svg=$('map');
  
  if(tab==='List úkolů'){svg.style.display='none';$('wk').style.display=has?'block':'none';if(has)$('wk').innerHTML=wkHtml();return}
  $('wk').style.display='none';svg.style.display='block';svg.innerHTML='';
  
  const visLines = layout();

  // Vytvoření viewportu pro pan/zoom
  const vp = el('g', {id:'vp', transform:`translate(${panX},${panY}) scale(${scale})`}, svg);

  visLines.forEach(l=>{
    const hasVisible = l.s.some(k => pos[k]);
    if (!hasVisible) return;
    const t=el('text',{x:cell[l.id][0],y:cell[l.id][1],class:'ln',fill:l.c,tabindex:0,role:'button', 'text-anchor':'middle'},vp);
    t.textContent=l.n;t.onclick=()=>openAdd(l);
    
    const visNodes = l.s.filter(k => pos[k]);
    for(let i=1;i<visNodes.length;i++) {
      const a = visNodes[i-1], b = visNodes[i];
      // Čára je barevná jen tehdy, pokud je cílová stanice aktivní, jinak ztlumená šedá
      const strokeC = isActive(b) ? l.c : 'var(--line)';
      el('path',{d:seg(pos[a],pos[b]),fill:'none',stroke:strokeC,'stroke-width':5,'stroke-linejoin':'round','stroke-linecap':'round'},vp);
    }
  });

  D.links.forEach(([a,b])=>{if(!pos[a]||!pos[b])return;
    const x=grpOf(lineOf(a))!==grpOf(lineOf(b));
    el('path',{d:seg(pos[a],pos[b]),fill:'none',stroke:x?'var(--ink)':lineOf(a).c,'stroke-width':8,'stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':x?'14 8':'none'},vp);
  });

  for(const k in pos){
    const s=D.st[k], active = isActive(k);
    const strokeC = active ? lineOf(k).c : 'var(--mute)';
    const g=el('g',{class:'st',tabindex:0,role:'button','aria-label':s.n,transform:`translate(${pos[k]})`},vp);
    
    const n=pass(k);
    if(n)el('circle',{class:'ring',r:R+7,stroke:'var(--red)'},g);
    if(hl===k)el('circle',{class:'ring',r:R+10,stroke:'#2f7de1'},g);
    if(s.s===0&&D.picks.includes(k))el('circle',{r:R+6,fill:'none',stroke:strokeC,'stroke-width':2,'stroke-dasharray':'2 4'},g); 
    
    el('circle',{r:R,stroke:strokeC,'stroke-width':4,fill:s.s===2?'var(--ink)':s.s===1?strokeC:'var(--panel)','stroke-dasharray':s.s===0?'4 3':'none'},g);
    for(let i=0;i<n;i++)el('circle',{r:3.5,cx:(i-(n-1)/2)*9,cy:-R-14,fill:'var(--red)'},g); 
    
    wrap(s.n).forEach((tx,j)=>{
      const textNode = el('text',{class:'lbl',y:R+18+j*12},g);
      textNode.textContent=tx;
      if(!active) { textNode.style.fill = 'var(--mute)'; textNode.style.stroke = 'var(--bg)'; }
    });
    g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tapSt(k)}};
  }
}

function wkHtml(){
  const H=k=>`<button class="it" data-k="${k}"><i style="background:${lineOf(k).c}"></i>${esc(D.st[k].n)}<small>${ST[D.st[k].s]}</small></button>`;
  const due=dueList();
  
  const picks1 = D.picks || [];
  const picks2 = groups().flatMap(g=>nextFor(g, 2, picks1));
  const picks3 = groups().flatMap(g=>nextFor(g, 2, [...picks1, ...picks2]));
  
  return '<h3>Tento týden na obzoru</h3>'+(picks1.length?picks1.map(H).join(''):'<div class="sub">Vše načato. Mapa roste!</div>')
   +'<h3>K procvičení (Přetížené stanice)</h3>'+(due.length?due.map(H).join('')+'<button class="go" id="go2" style="margin-top:6px">Jet vlakem</button>':'<div class="sub">Všechno umíš.</div>')
   +'<h3>Příští týden</h3>'+(picks2.length?picks2.map(H).join(''):'<div class="sub">Zatím prázdno.</div>')
   +'<h3>Za 14 dní</h3>'+(picks3.length?picks3.map(H).join(''):'<div class="sub">Zatím prázdno.</div>');
}

/* --- interakce & Pan/Zoom --- */
const svg=$('map');
const pt=e=>{
  const r=svg.getBoundingClientRect();
  return [(e.clientX - r.left - panX) / scale, (e.clientY - r.top - panY) / scale];
};
const hit=(p,r)=>Object.keys(pos).filter(k=>Math.hypot(pos[k][0]-p[0],pos[k][1]-p[1])<r).sort((a,b)=>Math.hypot(pos[a][0]-p[0],pos[a][1]-p[1])-Math.hypot(pos[b][0]-p[0],pos[b][1]-p[1]))[0];

svg.onpointerdown=e=>{
  if(tab==='List úkolů') return;
  const p=pt(e);
  const k=hit(p, 24 / scale);
  if (k) {
    drag={k,p,moved:false};
  } else {
    isPanning = true;
    startPan = {x: e.clientX - panX, y: e.clientY - panY};
  }
  try{svg.setPointerCapture(e.pointerId)}catch(x){}
};
svg.onpointermove=e=>{
  if(isPanning) {
    panX = e.clientX - startPan.x;
    panY = e.clientY - startPan.y;
    const vp = $('vp');
    if(vp) vp.setAttribute('transform', `translate(${panX},${panY}) scale(${scale})`);
    return;
  }
  if(!drag)return;const p=pt(e);
  if(Math.hypot(p[0]-drag.p[0],p[1]-drag.p[1])>8 / scale)drag.moved=true;
  if(drag.moved&&drag.k){
    let t=$('tmp');if(!t)t=el('path',{id:'tmp',fill:'none','stroke-width':8,'stroke-linecap':'round',opacity:.55,'pointer-events':'none'},$('vp'));
    t.setAttribute('stroke',lineOf(drag.k).c);t.setAttribute('d',seg(pos[drag.k],p));
  }
};
svg.onpointerup=e=>{
  if(isPanning) { isPanning = false; return; }
  if(!drag)return;const d=drag;drag=null;const t=$('tmp');if(t)t.remove();const p=pt(e);
  if(!d.moved){if(d.k)tapSt(d.k);else{const l=D.lines.find(l=>cell[l.id]&&Math.hypot(p[0]-cell[l.id][0], p[1]-cell[l.id][1])<40 / scale);if(l)openAdd(l)}return}
  if(d.k){const k=hit(p,28 / scale);if(k&&k!==d.k)connect(d.k,k)}
};

// Zoom kolečkem myši
svg.onwheel = e => {
  e.preventDefault();
  const xs = (e.clientX - panX) / scale;
  const ys = (e.clientY - panY) / scale;
  const delta = e.deltaY > 0 ? 0.9 : 1.1; // 0.9 oddálení, 1.1 přiblížení
  scale *= delta;
  scale = Math.max(0.1, Math.min(scale, 5)); // Omezení zoomu
  panX = e.clientX - xs * scale;
  panY = e.clientY - ys * scale;
  const vp = $('vp');
  if(vp) vp.setAttribute('transform', `translate(${panX},${panY}) scale(${scale})`);
};

function connect(a,b){
  if(D.st[a].s<1||D.st[b].s<1){say('Spojit jdou jen aktivní témata (Učím se / Umím).');return}
  if(D.links.some(l=>l.includes(a)&&l.includes(b))){say('Tato linka už je spojená.');return}
  D.links.push([a,b]);save();say('Vytvořen přestup: '+D.st[a].n+' ↔ '+D.st[b].n);render();
}
function tapSt(k){
  if(linkFrom){const a=linkFrom;linkFrom=null;if(a!==k)connect(a,k);else{say(HINT)}return}
  openSt(k);
}
function closeAll(){document.querySelectorAll('.pn').forEach(p=>p.classList.remove('on'))}
function show(id,f){closeAll();$(id).classList.add('on');if(f)f.focus()}
document.querySelectorAll('.x').forEach(b=>b.onclick=()=>{closeAll();if(run){run=null;hl=null;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
window.onresize=()=>{
  panX = window.innerWidth/2; panY = window.innerHeight/2; render();
};

function openSt(k){
  sel=k;const s=D.st[k];
  $('sn').textContent=s.n;$('ss').textContent=lineOf(k).n;
  [...$('sg').children].forEach((b,i)=>b.setAttribute('aria-pressed',s.s===i));
  const n=pass(k);$('rv').hidden=!n;
  if(n)$('rvt').textContent='Potřebuje procvičit '+(n>1?'(už '+n+' dny)':'');
  $('lk').innerHTML=links(k).map(l=>{const o=l[0]===k?l[1]:l[0];return'<span class="chip">'+esc(D.st[o].n)+'<button data-u="'+o+'" aria-label="Odpojit">×</button></span>'}).join('');
  $('nt').value=s.note||'';show('p-st');
}
ST.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{setS(sel,i);render();openSt(sel)};$('sg').appendChild(b)});
$('lk').onclick=e=>{const u=e.target.dataset.u;if(u){D.links=D.links.filter(l=>!(l.includes(sel)&&l.includes(u)));save();render();openSt(sel)}};
$('rok').onclick=()=>{review(sel,true);render();closeAll();say('Skvěle. Posouvám do paměti.')};
$('rno').onclick=()=>{review(sel,false);render();closeAll();say('Nevadí, zkusíš to znovu brzy.')};
$('lnk').onclick=()=>{if(D.st[sel].s<1){say('Založ stanici (Učím se), než uděláš přestup.');closeAll();return}linkFrom=sel;closeAll();say('Tažením nebo klepnutím vyber druhou stanici pro přestup.')};
$('nt').oninput=e=>{D.st[sel].note=e.target.value;save()};
$('sdel').onclick=()=>{D.lines.forEach(l=>l.s=l.s.filter(k=>k!==sel));D.links=D.links.filter(l=>!l.includes(sel));delete D.st[sel];save();closeAll();render()};

function startRun(){const r=route();if(!r.length)return;run={r,i:0};showRun()}
function showRun(){
  if(run.i>=run.r.length){run=null;hl=null;closeAll();say('Síť vyčištěna.');render();return}
  const k=run.r[run.i];hl=k;
  $('rs').textContent='Zastávka '+(run.i+1)+' z '+run.r.length+' · '+lineOf(k).n;
  $('rn').textContent=D.st[k].n;$('rnote').textContent=D.st[k].note||'';
  show('p-run');
  if(tab==='List úkolů'||!pos[k])tab='Aktuální mapa';
  render();
}
$('go').onclick=startRun;
$('wk').onclick=e=>{if(e.target.id==='go2')return startRun();const b=e.target.closest('[data-k]');if(b)openSt(b.dataset.k)};
$('yes').onclick=()=>{review(run.r[run.i],true);run.i++;showRun()};
$('nope').onclick=()=>{review(run.r[run.i],false);run.i++;showRun()};
$('skip').onclick=()=>{run.i++;showRun()};
$('bd').onclick=()=>{D.off=(D.off||0)+1;save();say('Čas se posunul o 1 den.');render()};

function openAdd(l){
  editLine=l||null;$('an').value=l?l.n:'';$('ax').value='';
  $('at').textContent=l?'Nová témata: '+l.n:'Nová linka a témata';$('adel').hidden=!l;
  show('p-add',l?$('ax'):$('an'));
}
$('ba').onclick=()=>openAdd(null);$('be').onclick=()=>openAdd(null);
$('ago').onclick=()=>{
  const name=$('an').value.trim(),text=$('ax').value;
  if(!name&&!/^\s*(#.+|.+:)\s*$/m.test(text)){$('an').focus();return}
  add(text,name,'');closeAll();render();
};
$('adel').onclick=()=>{
  const l=editLine;if(!l)return;D.lines=D.lines.filter(x=>x!==l);
  const used=new Set();D.lines.forEach(x=>x.s.forEach(k=>used.add(k)));
  for(const k in D.st)if(!used.has(k)){delete D.st[k];D.links=D.links.filter(z=>!z.includes(k))}
  save();closeAll();render();
};

$('b-export').onclick = () => {
  const dl = document.createElement('a');
  dl.setAttribute("href", "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(D)));
  dl.setAttribute("download", "linky_uceni_pamet.json");
  dl.click(); say('Záloha stažena.');
};
$('b-import').onclick = () => $('f-import').click();
$('f-import').onchange = (e) => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = (event) => { try { D = JSON.parse(event.target.result); save(); render(); say('Načteno!'); } catch(err) {} };
  r.readAsText(f); e.target.value=''; 
};

render();
</script>
</body>
