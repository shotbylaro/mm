<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linky učení</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap">
<style>
:root{--bg:#0f0a1f;--ink:#f1ecff;--mute:#9a8fc0;--panel:#1b1233;--line:#352a57;--halo:#0f0a1f;--red:#ff5c70;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Overpass',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 4px;flex-wrap:wrap}
h1{font-size:18px;font-weight:800;margin:0;margin-right:auto}
#cnt{font-size:13px;color:var(--mute)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.add{border:0;background:var(--ink);color:var(--bg);border-radius:20px;padding:7px 16px;font-weight:600;font-size:14px}
.sm{border:2px solid var(--line);background:transparent;border-radius:20px;padding:4px 11px;font-size:13px;font-weight:600}
:focus-visible{outline:3px solid #2f7de1;outline-offset:2px}
#tabs{display:flex;gap:6px;padding:6px 16px;overflow-x:auto}
.tab{border:2px solid var(--line);background:transparent;border-radius:18px;padding:5px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bd{background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:1px 6px;margin-left:6px}
#ban{display:none;margin:2px 16px 4px;padding:8px 12px;border-radius:10px;background:var(--panel);border:2px solid var(--red);align-items:center;gap:10px;justify-content:space-between;font-size:14px}
#tip{padding:0 16px 6px;font-size:13px;color:var(--mute);min-height:20px}
main{flex:1;min-height:0;overflow:hidden;position:relative}
svg{display:block;user-select:none;-webkit-user-select:none}
.st{cursor:pointer}
.lbl{font-size:11.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;pointer-events:none;text-anchor:middle}
.ln{font-size:14px;font-weight:800;cursor:pointer;paint-order:stroke;stroke:var(--halo);stroke-width:4px}
.ring{fill:none;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:p 1.1s ease-in-out infinite alternate}
@keyframes p{from{opacity:.95;transform:scale(1)}to{opacity:.25;transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
#wk{display:none;padding:8px 16px 90px;max-width:600px;height:100%;overflow:auto}
#wk h3{font-size:15px;margin:16px 0 8px}
.it{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px 8px 24px;margin-bottom:6px;font-weight:600;position:relative}
.it i{position:absolute;left:9px;top:14px;width:8px;height:8px;border-radius:50%}
.it small{color:var(--mute);font-weight:400}
#empty{display:none;max-width:380px;margin:12vh auto 0;padding:0 20px;text-align:center;color:var(--mute);line-height:1.5}
#empty b{color:var(--ink);font-size:20px;display:block;margin-bottom:6px}
.pn{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 24px));background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.14);max-height:82vh;overflow:auto}
.pn.on{display:block}
.pn h2{margin:0 0 4px;font-size:18px}
.sub{font-size:13px;color:var(--mute);margin-bottom:10px}
.sg{display:flex;gap:6px;margin-bottom:10px}
.sg button{flex:1;border:2px solid var(--line);background:transparent;border-radius:8px;padding:8px 4px;font-size:14px;font-weight:600}
.sg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--panel)}
.sg .ok{border-color:#1f9d55;color:#1f9d55}.sg .no{border-color:var(--red);color:var(--red)}
textarea,input[type=text]{width:100%;border:2px solid var(--line);border-radius:8px;background:transparent;padding:8px;font-size:14px;margin-bottom:8px}
textarea{resize:none;height:100px}#nt{height:60px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:2px}
.go{width:100%;border:0;background:var(--ink);color:var(--panel);border-radius:8px;padding:10px;font-weight:600;margin-bottom:8px}
.row{display:flex;justify-content:space-between;margin-top:4px}
.row button{border:0;background:none;font-weight:600;font-size:14px;text-decoration:underline;padding:4px}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:14px;padding:1px 4px 1px 10px;font-size:13px;margin:0 6px 6px 0}
.chip button{border:0;background:none;font-size:16px;padding:0 4px}
.msg{font-size:13px;color:var(--mute);margin:-2px 0 8px}
#map{width:100%;height:100%;touch-action:none;cursor:grab}
.rl{font-size:13.5px;font-weight:800;paint-order:stroke;stroke:var(--halo);stroke-width:4px;cursor:pointer}
.sm[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#zm{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
#zm button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:18px}
input[type=text],input[type=password]{width:100%;border:2px solid var(--line);border-radius:8px;background:transparent;padding:8px;font-size:14px;margin-bottom:8px}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
#gate>div{width:min(300px,86%)}#gate b{display:block;font-size:22px;margin-bottom:12px}
.mb{display:block;width:100%;text-align:left;border:2px solid var(--line);background:transparent;border-radius:8px;padding:8px;margin-bottom:6px;font-size:13px;font-weight:600}
.mb.sel{border-color:var(--ink)}.mb.dn{border-color:#2fb36b;opacity:.55}.mb.bad{border-color:var(--red);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pb{height:8px;border-radius:4px;background:var(--line);margin:6px 0;overflow:hidden}.pb i{display:block;height:100%;background:var(--ink)}
.pr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;gap:8px}
.okr{border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--panel);font-size:14px}
.okr small{color:var(--mute);display:block}
.okr input,input[type=date]{width:auto;margin:4px 0 0;padding:4px 6px;border:2px solid var(--line);border-radius:8px;background:transparent;font-size:13px}
#p-add input[type=date]{margin-bottom:8px}
select{width:100%;border:2px solid var(--line);border-radius:8px;background:var(--panel);padding:8px;font-size:14px;margin-bottom:8px}
.wr{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--line)}
.wr i{width:8px;height:8px;border-radius:50%;flex:none}
.wn{flex:1;min-width:0;cursor:pointer;font-weight:600}.wn small{display:block}
.wr .sm{padding:2px 10px;font-size:15px}
.wr .sm[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.dvo{font:12px ui-monospace,Menlo,Consolas,monospace;background:#0a0615;border:2px solid var(--line);border-radius:8px;padding:8px;height:140px;overflow:auto;margin-bottom:8px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="gate"><div><b>Minimetro</b><input type="password" id="gp" placeholder="Heslo" autocomplete="current-password" aria-label="Heslo"><button class="go" id="gb">Vstoupit</button><div class="msg" id="gm"></div></div></div>
<header>
  <h1>Linky učení</h1>
  <span id="cnt"></span>
  <button class="sm" id="bd" title="Posune čas, abys viděl opakování">+1 den (test)</button>
  <button class="sm" id="bdv" aria-label="Konzole" title="Konzole (klávesa `)">&gt;_</button><button class="sm" id="bm">Spojovačka</button><button class="sm" id="bv" aria-pressed="false">Odkrýt vše</button><button class="sm" id="bx" hidden>Záloha</button><button class="sm" id="bi">Import</button><input type="file" id="fi" accept="application/json,.json" hidden><button class="add" id="ba">+ Přidat</button>
</header>
<nav id="tabs" role="tablist"></nav>
<div id="pgc" style="display:none;gap:6px;padding:0 16px 6px;flex-wrap:wrap"></div>
<div id="ban"><span id="bt"></span><button class="add" id="go">Jet vlakem</button></div>
<div id="tip"></div>
<main id="mn">
  <div id="empty"><b>Vlož první témata</b>Každý řádek je jedno téma, předmět napiš jako nadpis s dvojtečkou.<br><br><button class="add" id="be">Vložit témata</button></div>
  <svg id="map" role="group" aria-label="Mapa témat"></svg>
  <div id="wk"></div>
  <div id="zm"><button id="z1" aria-label="Přiblížit">+</button><button id="z2" aria-label="Oddálit">−</button><button id="z3" aria-label="Celá mapa">⌂</button></div>
</main>

<div class="pn" id="p-add" role="dialog" aria-label="Přidat témata">
  <h2 id="at">Přidat témata</h2><div class="sub"></div>
  <label for="ag">Předmět</label><input type="text" id="ag" list="gl" placeholder="např. Čeština" autocomplete="off"><datalist id="gl"></datalist>
  <label for="an">Hlavní téma (okruh)</label><input type="text" id="an" placeholder="např. Pravopis" autocomplete="off">
  <label for="ad">Termín (nepovinné)</label><input type="date" id="ad" aria-label="Termín">
  <label for="ax">Podtémata, každé na nový řádek</label>
  <textarea id="ax" placeholder="Newtonovy zákony&#10;Energie"></textarea>
  <div class="msg">Víc předmětů naráz: nadpisy s dvojtečkou (Fyzika:). Stejný název ve dvou předmětech se spojí přestupem.</div>
  <button class="go" id="ago">Přidat</button>
  <div class="row"><button id="adel" hidden>Smazat předmět</button><button class="x">Zavřít</button></div>
</div>

<div class="pn" id="p-st" role="dialog" aria-label="Detail tématu">
  <h2 id="sn"></h2><div class="sub" id="ss"></div>
  <div class="sg" id="sg"></div>
  <div id="rv" hidden><div class="sub" id="rvt"></div><div class="sg"><button class="ok" id="rok">Pamatuju ✓</button><button class="no" id="rno">Zapomněl jsem</button></div></div>
  <div id="lkn" class="sub" hidden></div>
  <label for="mw">Týden učení</label><select id="mw"></select>
  <button class="sm" id="hd" aria-pressed="false" style="margin-bottom:10px">Vadí mi</button>
  <div id="lk"></div>
  <button class="go" id="lnk">Spojit s dalším tématem</button>
  <input type="text" id="su" placeholder="Odkaz na materiály (Notion, Google Docs, NotebookLM…)" aria-label="Odkaz"><a id="so" class="go" target="_blank" rel="noopener noreferrer" style="display:none;text-align:center;text-decoration:none">Otevřít materiály</a>
  <textarea id="nt" placeholder="Poznámky…" aria-label="Poznámky"></textarea>
  <div class="row"><button id="sdel">Smazat téma</button><button class="x">Zavřít</button></div>
</div>

<div class="pn" id="p-mg" role="dialog" aria-label="Spojovačka">
  <h2>Spojovačka</h2><div class="sub" id="mgs"></div>
  <div id="mgb" style="display:flex;gap:8px"><div id="mgl" style="flex:1"></div><div id="mgr" style="flex:1"></div></div>
  <div class="row"><button id="mgn">Nová hra</button><button class="x">Zavřít</button></div>
</div>

<div class="pn" id="p-dev" role="dialog" aria-label="Konzole">
  <h2>Konzole</h2><div class="dvo" id="dvo"></div>
  <input type="text" id="dvi" placeholder="napiš příkaz, např. testreset" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Příkaz">
  <div class="row"><span></span><button class="x">Zavřít</button></div>
</div>

<div class="pn" id="p-run" role="dialog" aria-label="Jízda opakování">
  <div class="sub" id="rs"></div><h2 id="rn"></h2><div class="sub" id="rnote"></div>
  <div class="sg"><button class="ok" id="yes">Pamatuju ✓</button><button class="no" id="nope">Zapomněl jsem</button></div>
  <div class="row"><button id="skip">Přeskočit</button><button class="x">Ukončit jízdu</button></div>
</div>

<script>
const NS='http://www.w3.org/2000/svg',X0=220,STEP=150,ROW=124,GG=50,Y0=80,DAY=864e5,INT=[1,3,7,14,30,60],R=11;
const PAL=['#2f6fd6','#d9342b','#1f9d55','#e08a00','#8b45c9','#0aa2b8','#d6428c','#6b7280','#7a9a01','#b5651d'];
const ST=['Nové','Učím se','Umím'];
const SEED=`@Čeština: příprava na maturitu

Klimatické změny
Česká literatura:

České: 19. století
České: 1. polovina 20. století
České: po roce 1950
České: hlavní díla

Světová literatura:
Literární směry
Světové: do 18. století
Světové: 19. století
Světové: 20. století

Světoví spisovatelé

Pojmy: mix
@Fotografie: maturitní okruhy
1. Reklama a legislativa:

const $=i=>document.getElementById(i);
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const low=s=>s.trim().toLowerCase();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null;try{D=JSON.parse(localStorage.getItem('metro5')||'null')}catch(e){}
const save=()=>{try{localStorage.setItem('metro5',JSON.stringify(D))}catch(e){}};
const now=()=>Date.now()+((D&&D.off)||0)*DAY;
let tab='',sel=null,pos={},cell={},drag=null,linkFrom=null,run=null,hl=null,editLine=null;
const grpOf=l=>(l.g||'Ostatní').split(':')[0];
const groups=()=>[...new Set(D.lines.map(grpOf))];
const lineOf=k=>D.lines.find(l=>l.s.includes(k));
const links=k=>D.links.filter(l=>l.includes(k));
const say=t=>$('tip').textContent=t;
const HINT='Tažením pozadí posouváš mapu, kolečkem nebo štípnutím zoomuješ. Spojit jde jen to, co už se učíš nebo umíš.';

function add(text,defName,g0){
  let cur=defName.trim(),grp=g0||'';
  const lineFor=n=>{let l=D.lines.find(x=>low(x.n)===low(n));
    if(!l){l={id:'l'+Date.now().toString(36)+D.lines.length,n:n.trim(),c:PAL[D.lines.length%PAL.length],s:[]};if(grp)l.g=grp;D.lines.push(l)}return l};
  text.split('\n').forEach(raw=>{
    let t=raw.trim();if(!t)return;
    if(t[0]==='@'){grp=t.slice(1).trim();return}
    const h=t.match(/^#+\s*(.+?):?$/)||t.match(/^(.+):$/);
    if(h){cur=h[1].trim();lineFor(cur);return}
    t=t.replace(/^([-*•]|\d+[.)])\s+/,'');if(!t||!cur)return;
    const l=lineFor(cur);
    let id=Object.keys(D.st).find(k=>low(D.st[k].n)===low(t));
    if(!id){id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);D.st[id]={n:t,s:0}}
    if(!l.s.includes(id))l.s.push(id);
  });
  save();
}
if(!D){D={lines:[],st:{},links:[]};add(SEED,'')}
if(!D.links)D.links=[];

/* --- učení a opakování --- */
const pass=k=>{const s=D.st[k];return s.s===2&&s.due<=now()?Math.min(6,1+Math.floor((now()-s.due)/DAY)):0};
const dueList=()=>Object.keys(D.st).filter(k=>pass(k)>0);
function setS(k,i){const s=D.st[k];if(i>0&&s.wk>curWeek()){s.wk=curWeek();s.m=true}s.s=i;s.t=now();if(i===2){if(!s.due){s.lv=0;s.due=now()+DAY;addScore(20,'za naučené téma');bump('n')}}else{delete s.due;delete s.lv}save()}
function review(k,ok){const s=D.st[k];s.lv=ok?Math.min((s.lv||0)+1,5):0;
  s.due=now()+Math.max(.5,INT[s.lv]*(s.hard?.6:1)/(1+.25*Math.min(4,links(k).length)))*DAY;if(ok)addScore(10,'za zopakování');bump('r');save()}
function route(){
  const due=dueList().sort((a,b)=>D.st[a].due-D.st[b].due),set=new Set(due),seen=new Set(),r=[];

const hit=(p,r)=>[...REV].filter(k=>pos[k]&&Math.hypot(pos[k][0]-p[0],pos[k][1]-p[1])<r).sort((a,b)=>Math.hypot(pos[a][0]-p[0],pos[a][1]-p[1])-Math.hypot(pos[b][0]-p[0],pos[b][1]-p[1]))[0];
function zoomAt(cx,cy,f){
  const r=svg.getBoundingClientRect(),mx=cx-r.left,my=cy-r.top,k=Math.min(2.5,Math.max(.25,view.k*f)),q=k/view.k;
  view.x=mx-(mx-view.x)*q;view.y=my-(my-view.y)*q;view.k=k;applyView();
}
svg.onpointerdown=e=>{
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);try{svg.setPointerCapture(e.pointerId)}catch(x){}
  if(ptrs.size===2){drag=null;const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])};return}
  const p=wpt(e);drag={k:hit(p,28),sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,moved:false};
};
svg.onpointermove=e=>{
  if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,d/pinch.d);pinch.d=d;return}
  if(!drag)return;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6)drag.moved=true;
  if(!drag.moved)return;
  if(tab!=='Cesta'&&drag.k&&D.st[drag.k].s>0){
    let t=$('tmp');if(!t)t=el('path',{id:'tmp',fill:'none','stroke-width':8,'stroke-linecap':'round',opacity:.55,'pointer-events':'none'},$('vp'));
    t.setAttribute('stroke',lineOf(drag.k).c);t.setAttribute('d',seg(pos[drag.k],wpt(e)));
  }else{view.x=drag.vx+e.clientX-drag.sx;view.y=drag.vy+e.clientY-drag.sy;applyView()}
};
svg.onpointerup=e=>{
  ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;drag=null;return}
  if(!drag)return;const d=drag;drag=null;const t=$('tmp');if(t)t.remove();const p=wpt(e);
  if(!d.moved){
    if(d.k)tapSt(d.k);
    else if(tab==='Cesta'){const tn=TN.find(t=>Math.hypot(t.x-p[0],t.y-p[1])<30);if(tn)openTest(tn)}
    else if(p[0]<X0-40){const l=D.lines.find(l=>rowY[l.id]!==undefined&&Math.abs(rowY[l.id]-p[1])<ROW/2);if(l)openAdd(l)}
    return;
  }
  if(tab!=='Cesta'&&d.k&&D.st[d.k].s>0){const k=hit(p,30);if(k&&k!==d.k)connect(d.k,k)}
  else if(tab!=='Cesta'&&d.k)say('Spojit jdou jen témata, která už se učíš nebo umíš.');
};
svg.onpointercancel=e=>{ptrs.delete(e.pointerId);drag=null;pinch=null;const t=$('tmp');if(t)t.remove()};
svg.onwheel=e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15)};
const zc=f=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f)};
$('z1').onclick=()=>zc(1.25);$('z2').onclick=()=>zc(1/1.25);$('z3').onclick=()=>{needFit=true;render()};
function connect(a,b){
  if(D.st[a].s<1||D.st[b].s<1){say('Spojit jdou jen témata, která už se učíš nebo umíš.');return}
  if(D.links.some(l=>l.includes(a)&&l.includes(b))){say('Tahle témata už spojená jsou.');return}
  const xg=grpOf(lineOf(a))!==grpOf(lineOf(b)),pts=xg?15:5;D.links.push([a,b]);D.score=(D.score||0)+pts;save();say('Spojeno: '+D.st[a].n+' ↔ '+D.st[b].n+' · +'+pts+(xg?' (přestup mezi předměty)':''));render();
}
function tapSt(k){
  if(linkFrom){const a=linkFrom;linkFrom=null;if(a!==k)connect(a,k);else say(HINT);return}
  openSt(k);
}
function urlLink(){const u=$('su').value.trim(),a=$('so'),ok=/^https?:\/\//i.test(u);a.style.display=ok?'block':'none';if(ok)a.href=u}
$('su').oninput=()=>{D.st[sel].url=$('su').value.trim();save();urlLink()};
$('bv').onclick=()=>{D.all=!D.all;save();render()};
let DL=null;
try{if(window.claude)claude.use('downloads').then(d=>{DL=d;$('bx').hidden=!d}).catch(()=>{})}catch(e){}
$('bx').onclick=async()=>{try{await DL.save({filename:'minimetro-pamet.json',data:JSON.stringify(D,null,1)});say('Záloha uložena.')}catch(e){say('Zálohu se nepodařilo uložit.')}};
$('bi').onclick=()=>$('fi').click();
$('fi').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.lines)||typeof o.st!=='object'||!o.st)throw 0;
    o.links=o.links||[];D=o;save();needFit=true;render();say('Paměť načtena ('+Object.keys(o.st).length+' témat).')}catch(x){say('Tenhle soubor nevypadá jako záloha.')}};
  r.readAsText(f);e.target.value='';
};
/* spojovačka */
let mg=null;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function openMg(focus,tn){
  const pool=Object.keys(D.st).filter(k=>D.st[k].s>0);let pairs=[];
  pool.forEach(k=>(D.st[k].note||'').split('\n').forEach(x=>{const m=x.split(/\s=\s|\s[-–]\s/);if(m.length>1&&m[0].trim()&&m[1].trim())pairs.push({k,a:m[0].trim(),b:m.slice(1).join(' – ').trim()})}));
  if(pairs.length<3){
    const by={};pool.forEach(k=>{const l=lineOf(k);(by[l.id]=by[l.id]||[]).push(k)});
    pairs=Object.keys(by).map(id=>{const k=shuf(by[id])[0];return{k,a:D.st[k].n,b:lineOf(k).n}});
  }
  const F=k=>focus&&focus.includes(k)?1:0;pairs=shuf(pairs).sort((x,y)=>F(y.k)-F(x.k)||pass(y.k)-pass(x.k)).slice(0,5);
  mg={tn,focus,pairs,L:null,done:new Set(),rd:new Set(),bad:new Set(),miss:0,flash:null,right:shuf(pairs.map((p,i)=>i)),end:false};
  drawMg();show('p-mg');
}
function drawMg(){
  const m=mg;
  if(!m.end)$('mgs').textContent=m.pairs.length<3?'Začni se učit aspoň 3 témata z různých okruhů, nebo piš do poznámek pojmy ve tvaru „pojem = vysvětlení“.':'Klepni vlevo a pak vpravo. Chyby: '+m.miss;
  $('mgl').innerHTML=m.pairs.map((p,i)=>`<button class="mb${m.done.has(i)?' dn':''}${m.L===i?' sel':''}" data-l="${i}">${esc(p.a)}</button>`).join('');
  $('mgr').innerHTML=m.right.map(i=>`<button class="mb${m.rd.has(i)?' dn':''}${m.flash===i?' bad':''}" data-r="${i}">${esc(m.pairs[i].b)}</button>`).join('');
  m.flash=null;
}
$('mgb').onclick=e=>{
  const b=e.target.closest('button');if(!b||!mg||mg.end||b.classList.contains('dn'))return;
  if(b.dataset.l!==undefined){mg.L=+b.dataset.l;drawMg();return}
  if(b.dataset.r!==undefined&&mg.L!==null){
    const L=mg.L,Rr=+b.dataset.r;mg.L=null;
    if(mg.pairs[L].b===mg.pairs[Rr].b){mg.done.add(L);mg.rd.add(Rr);if(mg.done.size===mg.pairs.length){finishMg();return}}
    else{mg.miss++;mg.bad.add(mg.pairs[L].k);mg.flash=Rr}
    drawMg();
  }
};
function finishMg(){
  const m=mg;m.end=true;let n=0;
  new Set(m.pairs.map(p=>p.k)).forEach(k=>{if(pass(k)>0){review(k,!m.bad.has(k));n++}});
  const pts=Math.max(5,m.pairs.length*5-m.miss*3);D.score=(D.score||0)+pts;bump('m');if(m.tn){D.tests=D.tests||{};D.tests[m.tn.key]={stars:m.miss===0?3:m.miss<=2?2:1}}save();drawMg();render();
  $('mgs').textContent='Hotovo! Chyby: '+m.miss+(n?' · zopakováno stanic: '+n:'')+' · +'+pts+' bodů';
}
$('mgn').onclick=()=>openMg(mg&&mg.focus,mg&&mg.tn);$('bm').onclick=()=>openMg();
/* týden v detailu, test cesty, konzole */
function fillWk(k){
  const s=D.st[k],w0=curWeek(),cw=Math.max(s.wk===undefined?w0:s.wk,w0);let o='';
  for(let w=w0;w<=w0+16;w++)o+=`<option value="${w}"${w===cw?' selected':''}>${w===w0?'Tento týden':'Týden'} · ${wkR(w)}</option>`;
  $('mw').innerHTML=o;$('hd').setAttribute('aria-pressed',!!s.hard);
  const lk=s.s===0&&s.wk>w0;$('lkn').hidden=!lk;if(lk)$('lkn').textContent='Zamčeno do týdne '+wkR(s.wk)+'. Vyber „Tento týden“, pokud ho chceš odemknout hned.';
}
$('mw').onchange=e=>{const s=D.st[sel];s.wk=+e.target.value;s.m=true;replan();render();openSt(sel)};
$('hd').onclick=()=>{D.st[sel].hard=!D.st[sel].hard;save();render();openSt(sel)};
function openTest(tn){
  const st=tn.ks.filter(k=>D.st[k].s>0);
  if(!st.length){say('Nejdřív začni aspoň jedno téma z tohoto týdne.');return}
  const np=st.reduce((a,k)=>a+(D.st[k].note||'').split('\n').filter(x=>/\s=\s|\s[-–]\s/.test(x)).length,0);
  if(np>=3)return openMg(st,tn);
  run={r:st,i:0,tn,ok:0};showRun();
}
function testreset(){
  Object.keys(D.st).forEach(k=>{const s=D.st[k];s.s=0;['due','lv','t','wk','m','hard'].forEach(x=>delete s[x])});
  D.links=[];D.score=0;D.stats={};D.tests={};D.off=0;D.all=false;run=null;hl=null;mg=null;linkFrom=null;
  D.wk=curWeek();replan();needFit=true;render();say('Veškerý progres byl vymazán.');
}
window.testreset=testreset;
const devLog=x=>{const d=document.createElement('div');d.textContent=x;$('dvo').appendChild(d);$('dvo').scrollTop=1e9};
function dev(cmd){
  const [c,...a]=cmd.trim().split(/\s+/),n=parseInt(a[0]);
  switch((c||'').toLowerCase()){
    case '':break;
    case 'help':['testreset – smaže veškerý progres (témata, poznámky a odkazy zůstanou)','fullreset – vrátí aplikaci do výchozího stavu s maturitními tématy','day [n] – posune čas o n dní','unlock – odkryje všechna témata na mapě','stats – shrnutí','clear – vyčistí konzoli'].forEach(devLog);break;
    case 'testreset':testreset();devLog('Hotovo. Veškerý progres je smazán.');break;
    case 'fullreset':D={lines:[],st:{},links:[]};add(SEED,'');D.wk=curWeek();replan();needFit=true;render();devLog('Aplikace je ve výchozím stavu.');break;
    case 'day':D.off=(D.off||0)+(n||1);save();render();devLog('Čas posunut o '+(n||1)+' d.');break;
    case 'unlock':D.all=true;save();render();devLog('Mapa odkryta.');break;
    case 'stats':devLog('témat: '+Object.keys(D.st).length+', umím: '+Object.keys(D.st).filter(k=>D.st[k].s===2).length+', spojů: '+D.links.length+', skóre: '+(D.score||0));break;
    case 'clear':$('dvo').innerHTML='';break;
    default:devLog('Neznámý příkaz. Napiš help.');
  }
}
window.dev=dev;
function openDev(){show('p-dev',$('dvi'));if(!$('dvo').children.length)devLog('Konzole. Napiš help.')}
$('bdv').onclick=openDev;
$('dvi').onkeydown=e=>{if(e.key==='Enter'){const v=e.target.value;devLog('> '+v);dev(v);e.target.value=''}};
document.addEventListener('keydown',e=>{if(e.key==='`'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();openDev()}});
/* heslo (jen lehký zámek, je vidět v kódu) */
let okPw=false;try{okPw=sessionStorage.getItem('mm_ok')==='1'}catch(e){}
if(okPw)$('gate').style.display='none';
$('gb').onclick=()=>{if($('gp').value==='minimetro'){try{sessionStorage.setItem('mm_ok','1')}catch(e){}$('gate').style.display='none'}else{$('gm').textContent='Špatné heslo.';$('gp').value=''}};
$('gp').onkeydown=e=>{if(e.key==='Enter')$('gb').click()};
function closeAll(){document.querySelectorAll('.pn').forEach(p=>p.classList.remove('on'))}
function show(id,f){closeAll();$(id).classList.add('on');if(f)f.focus()}
document.querySelectorAll('.x').forEach(b=>b.onclick=()=>{closeAll();if(run){run=null;hl=null;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
window.onresize=()=>render();

function openSt(k){
  sel=k;const s=D.st[k];
  $('sn').textContent=s.n;$('ss').textContent=lineOf(k).n+' · '+grpOf(lineOf(k));
  [...$('sg').children].forEach((b,i)=>b.setAttribute('aria-pressed',s.s===i));
  const n=pass(k);$('rv').hidden=!n;
  if(n)$('rvt').textContent='Čeká na zopakování '+(n>1?'(už '+n+' dny)':'');
  $('lk').innerHTML=links(k).map(l=>{const o=l[0]===k?l[1]:l[0];return'<span class="chip">'+esc(D.st[o].n)+'<button data-u="'+o+'" aria-label="Odpojit">×</button></span>'}).join('');
  $('nt').value=s.note||'';$('su').value=s.url||'';urlLink();fillWk(k);show('p-st');
}
ST.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n==='Nové'?'Nové':n;b.onclick=()=>{setS(sel,i);render();openSt(sel)};$('sg').appendChild(b)});
$('lk').onclick=e=>{const u=e.target.dataset.u;if(u){D.links=D.links.filter(l=>!(l.includes(sel)&&l.includes(u)));save();render();openSt(sel)}};
$('rok').onclick=()=>{review(sel,true);render();closeAll();say('Zopakováno. Další opakování naplánováno.')};
$('rno').onclick=()=>{review(sel,false);render();closeAll();say('Nevadí, zítra se na to podíváš znovu.')};
$('lnk').onclick=()=>{if(D.st[sel].s<1){say('Nejdřív téma začni, pak ho jde spojit.');closeAll();return}linkFrom=sel;closeAll();say('Klepni na téma, se kterým ho chceš spojit.')};
$('nt').oninput=e=>{D.st[sel].note=e.target.value;save()};
$('sdel').onclick=()=>{D.lines.forEach(l=>l.s=l.s.filter(k=>k!==sel));D.links=D.links.filter(l=>!l.includes(sel));delete D.st[sel];save();closeAll();render()};

/* jízda vlakem */
function startRun(){const r=route();if(!r.length)return;run={r,i:0};showRun()}
function showRun(){
  if(run.i>=run.r.length){if(run.tn){const f=(run.ok||0)/run.r.length;D.tests=D.tests||{};D.tests[run.tn.key]={stars:f>=.99?3:f>=.6?2:1};D.score=(D.score||0)+10;bump('m');save()}run=null;hl=null;closeAll();say('Jízda dokončena.');render();return}
  const k=run.r[run.i];hl=k;
  $('rs').textContent='Zastávka '+(run.i+1)+' z '+run.r.length+' · '+lineOf(k).n;
  $('rn').textContent=D.st[k].n;$('rnote').textContent=D.st[k].note||'';
  show('p-run');
  if(tab==='Plán'||!pos[k])tab='Vše';
  needFit=false;render();centerOn(k);
}
$('go').onclick=startRun;
$('wk').onclick=e=>{
  const t=e.target,d=t.dataset||{};
  if(t.id==='go2')return startRun();if(t.id==='mg2')return openMg();if(t.id==='addmain')return openAdd(null);
  if(t.id==='wmore'){wkShow+=6;return render()}
  if(d.p){const [i,x]=d.p.split('|'),g=groups()[+i];D.pace=D.pace||{};D.pace[g]=Math.max(1,Math.min(8,pace(g)+(+x)));replan();return render()}
  if(d.mv){const [k,x]=d.mv.split('|');return mv(k,+x)}
  if(d.hd){D.st[d.hd].hard=!D.st[d.hd].hard;save();return render()}
  const b=t.closest('[data-k]');if(b)openSt(b.dataset.k);
};
$('wk').onchange=e=>{const id=e.target.dataset.dl;if(!id)return;const l=D.lines.find(x=>x.id===id);if(l){if(e.target.value)l.dl=e.target.value;else delete l.dl;save();render()}};
$('yes').onclick=()=>{const k=run.r[run.i];if(pass(k)>0)review(k,true);run.ok=(run.ok||0)+1;run.i++;showRun()};
$('nope').onclick=()=>{const k=run.r[run.i];if(pass(k)>0)review(k,false);run.i++;showRun()};
$('skip').onclick=()=>{run.i++;showRun()};
$('bd').onclick=()=>{D.off=(D.off||0)+1;save();say('Uplynul další den.');render()};

/* přidávání */
function openAdd(l){
  editLine=l||null;$('gl').innerHTML=groups().map(g=>'<option value="'+esc(g)+'">').join('');
  $('ag').value=l?grpOf(l):(tab!=='Vše'&&tab!=='Plán'?tab:'');
  $('an').value=l?l.n:'';$('ad').value=l&&l.dl?l.dl:'';$('ax').value='';
  $('at').textContent=l?'Přidat do: '+l.n:'Nové hlavní téma';$('adel').hidden=!l;
  show('p-add',l?$('ax'):$('ag'));
}
$('ba').onclick=()=>openAdd(null);$('be').onclick=()=>openAdd(null);
$('ago').onclick=()=>{
  const name=$('an').value.trim(),text=$('ax').value,gs=$('ag').value.trim();
  if(!name&&!/^\s*(#.+|.+:)\s*$/m.test(text)){$('an').focus();return}
  const gl=D.lines.find(l=>grpOf(l)===gs);
  add(text,name,gs?(gl?(gl.g||gs):gs):'');
  const L=D.lines.find(l=>low(l.n)===low(name));
  if(L){if($('ad').value)L.dl=$('ad').value;else if(editLine)delete L.dl}
  save();closeAll();render();
};
$('adel').onclick=()=>{
  const l=editLine;if(!l)return;D.lines=D.lines.filter(x=>x!==l);
  const used=new Set();D.lines.forEach(x=>x.s.forEach(k=>used.add(k)));
  for(const k in D.st)if(!used.has(k)){delete D.st[k];D.links=D.links.filter(z=>!z.includes(k))}
  save();closeAll();render();
};
render();
</script>
</body>
